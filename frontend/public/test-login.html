<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Connexion TRADABOT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        .container {
            background: #2a2a3e;
            padding: 30px;
            border-radius: 10px;
        }
        h1 {
            color: #4ade80;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #3a3a4e;
            border: 1px solid #4a4a5e;
            border-radius: 5px;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #4ade80;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #3ac970;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            word-wrap: break-word;
        }
        .success {
            background: #10b981;
            color: white;
        }
        .error {
            background: #ef4444;
            color: white;
        }
        .info {
            background: #3b82f6;
            color: white;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Test de Connexion TRADABOT</h1>
        <p>Teste ta connexion ici pour voir l'erreur exacte:</p>
        
        <input type="email" id="email" placeholder="Email" value="yafoy2310@gmail.com">
        <input type="password" id="password" placeholder="Mot de passe" value="Moka2024!">
        
        <button onclick="testLogin()">🚀 Tester la Connexion</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '<div class="result info">⏳ Test en cours...</div>';
            
            try {
                console.log('Tentative de connexion:', { email, password: password.substring(0, 3) + '***' });
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                console.log('Status:', response.status);
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ CONNEXION RÉUSSIE!</h3>
                            <p><strong>Email:</strong> ${data.user.email}</p>
                            <p><strong>Rôle:</strong> ${data.user.role}</p>
                            <p><strong>Token:</strong> ${data.token.substring(0, 30)}...</p>
                            <p style="margin-top:15px;">
                                <a href="/dashboard" style="color: #4ade80;">→ Aller au Dashboard</a>
                            </p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ ERREUR DE CONNEXION</h3>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Message:</strong> ${data.detail || JSON.stringify(data)}</p>
                            <hr style="margin: 15px 0; border-color: rgba(255,255,255,0.2);">
                            <p><strong>Vérifications:</strong></p>
                            <ul style="text-align: left;">
                                <li>Email correct: ${email}</li>
                                <li>Mot de passe longueur: ${password.length} caractères</li>
                                <li>Commence par: ${password[0]}</li>
                                <li>Termine par: ${password[password.length - 1]}</li>
                            </ul>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Erreur:', error);
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ ERREUR RÉSEAU</h3>
                        <p><strong>Message:</strong> ${error.message}</p>
                        <p>Le serveur est peut-être inaccessible.</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
