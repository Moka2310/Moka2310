<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Mobile Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #1E1540;
            font-family: system-ui;
        }
    </style>
</head>
<body class="min-h-screen bg-[#1E1540] pt-24 pb-16 px-4 sm:px-6 md:px-8">
    <div class="max-w-7xl mx-auto w-full">
        <!-- Header -->
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold mb-8">
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">
                Panel Admin
            </span>
        </h1>

        <!-- Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 mb-12">
            <div class="bg-gradient-to-br from-[#2B1F5C] to-[#1E1540] rounded-2xl sm:rounded-3xl p-4 sm:p-6 border border-purple-500/30">
                <div class="flex items-center space-x-3 sm:space-x-4">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-blue-500/20 rounded-full flex items-center justify-center flex-shrink-0">
                        👥
                    </div>
                    <div class="min-w-0">
                        <p class="text-white/70 text-xs sm:text-sm">Utilisateurs</p>
                        <p class="text-xl sm:text-2xl font-bold text-white truncate">45</p>
                    </div>
                </div>
            </div>

            <div class="bg-gradient-to-br from-[#2B1F5C] to-[#1E1540] rounded-2xl sm:rounded-3xl p-4 sm:p-6 border border-purple-500/30">
                <div class="flex items-center space-x-3 sm:space-x-4">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-yellow-500/20 rounded-full flex items-center justify-center flex-shrink-0">
                        ⏰
                    </div>
                    <div class="min-w-0">
                        <p class="text-white/70 text-xs sm:text-sm">KYC en attente</p>
                        <p class="text-xl sm:text-2xl font-bold text-white truncate">3</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- KYC Request Card -->
        <div class="bg-gradient-to-b from-[#2B1F5C] to-[#1E1540] rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 border border-purple-500/30">
            <h2 class="text-xl sm:text-2xl font-bold text-white mb-4 sm:mb-6">Demandes KYC en attente</h2>
            
            <div class="bg-[#1E1540]/50 rounded-xl sm:rounded-2xl p-4 sm:p-6 border border-purple-500/20">
                <div class="flex flex-col gap-4">
                    <div class="flex-1">
                        <h3 class="text-lg sm:text-xl font-bold text-white mb-2">
                            John Doe
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm sm:text-base text-white/70 break-words">
                            <p class="break-all"><strong>Email:</strong> verylongemailaddress@example.com</p>
                            <p><strong>Pays:</strong> France</p>
                            <p><strong>Téléphone:</strong> +33 6 12 34 56 78</p>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto sm:self-end">
                        <button class="bg-gradient-to-r from-green-500 to-green-600 text-white px-4 py-2 rounded-lg w-full sm:w-auto">
                            ✓ Approuver
                        </button>
                        <button class="border-2 border-red-500 text-red-500 px-4 py-2 rounded-lg w-full sm:w-auto">
                            ✗ Rejeter
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
